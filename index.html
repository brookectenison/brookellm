<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brooke — No BS AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b14;
    --surface: #15111f;
    --border: #2e2440;
    --accent: #c9a0c0;
    --accent2: #e8847a;
    --text: #ede8e0;
    --muted: #7a6a8a;
    --user-bg: #1a1428;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at 30% 20%, #1a1030 0%, #0d0b14 60%);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    letter-spacing: 0.08em;
    color: var(--accent);
    line-height: 1;
  }

  .tagline {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-left: 2px solid var(--border);
    padding-left: 16px;
    line-height: 1.4;
  }

  .tagline span {
    color: var(--accent2);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c9a0c0;
    margin-left: auto;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message {
    display: flex;
    gap: 16px;
    animation: slideIn 0.25s ease-out;
    max-width: 820px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
  }

  .message.assistant .avatar {
    background: var(--accent);
    color: #000;
  }

  .message.user .avatar {
    background: var(--border);
    color: var(--muted);
  }

  .bubble {
    padding: 14px 18px;
    border-radius: 6px;
    font-size: 0.85rem;
    line-height: 1.7;
    max-width: 680px;
  }

  .message.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid #8b5e8b;
    color: var(--text);
  }

  .message.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    text-align: right;
  }

  .bubble p { margin-bottom: 0.6em; }
  .bubble p:last-child { margin-bottom: 0; }

  .bubble strong {
    color: var(--accent);
    font-weight: 600;
  }

  .bubble em {
    color: var(--accent2);
    font-style: italic;
  }

  .bubble code {
    background: rgba(201,160,192,0.1);
    border: 1px solid rgba(201,160,192,0.25);
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.8em;
    color: var(--accent);
  }

  .typing-indicator {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 4px 0;
  }

  .typing-indicator span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    padding: 40px;
    text-align: center;
  }

  .welcome-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    letter-spacing: 0.06em;
    color: var(--accent);
    line-height: 1;
  }

  .welcome-sub {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    max-width: 360px;
    line-height: 1.8;
  }

  .welcome-sub em {
    color: var(--accent2);
    font-style: normal;
  }

  .suggestions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    max-width: 560px;
  }

  .suggestion {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    letter-spacing: 0.02em;
  }

  .suggestion:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(212,255,0,0.05);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 32px;
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    max-width: 820px;
    margin: 0 auto;
  }

  #input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.82rem;
    padding: 12px 16px;
    border-radius: 4px;
    resize: none;
    min-height: 48px;
    max-height: 180px;
    line-height: 1.6;
    outline: none;
    transition: border-color 0.15s;
  }

  #input:focus {
    border-color: var(--accent);
  }

  #input::placeholder {
    color: var(--muted);
  }

  #send {
    background: var(--accent);
    color: #1a0a1e;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.1em;
    padding: 12px 24px;
    border-radius: 4px;
    cursor: pointer;
    height: 48px;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  #send:hover { background: #dbb8d8; }
  #send:active { transform: scale(0.97); }
  #send:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  .hint {
    font-size: 0.6rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .hint span { color: var(--accent2); }

  /* API key banner */
  #key-banner {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  #key-banner label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    white-space: nowrap;
  }

  #key-banner label span { color: var(--accent2); }

  #api-key-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    padding: 7px 12px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.15s;
    max-width: 400px;
  }

  #api-key-input:focus { border-color: var(--accent); }
  #api-key-input::placeholder { color: var(--muted); }

  #key-status {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #key-status.set { color: #a8d8a0; }
  #key-status.unset { color: var(--muted); }

  /* scrollbar */
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="logo">Brooke</div>
  <div class="tagline">
    No BS answers.<br>
    <span>Actually useful.</span>
  </div>
  <div class="status-dot"></div>
</header>

<div id="key-banner">
  <label>Google AI Studio Key <span>*</span></label>
  <input type="password" id="api-key-input" placeholder="AIza..." autocomplete="off" oninput="updateKeyStatus()" />
  <span id="key-status" class="unset">Not set</span>
</div>

<div id="welcome">
  <div class="welcome-title">BROOKE</div>
  <div class="welcome-sub">
    Straight talk, zero fluff.<br>
    <em>Occasional lolcat speak.</em> Always, "my dude."
  </div>
  <div class="suggestions">
    <button class="suggestion" onclick="useSuggestion(this)">Explain quantum entanglement simply</button>
    <button class="suggestion" onclick="useSuggestion(this)">What are the most common misperceptions of AI, especially LLMs?</button>
    <button class="suggestion" onclick="useSuggestion(this)">Explain Dutch grammar-- especially verb placement</button>
    <button class="suggestion" onclick="useSuggestion(this)">How do I actually get better at writing in French?</button>
    <button class="suggestion" onclick="useSuggestion(this)">Explain Schroedinger's cat</button>
  </div>
</div>

<div id="chat" style="display:none;"></div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Ask Brooke anything, my dude..." rows="1"></textarea>
    <button id="send" onclick="sendMessage()">Send</button>
  </div>
  <div class="hint">Enter to send · <span>Shift+Enter</span> for new line</div>
</footer>

<script>
const SYSTEM = `You are Brooke — a razor-sharp, no-nonsense AI assistant. Your personality:

- INCISIVE: Cut straight to what matters. No fluff, no padding, no "great question!". Lead with the actual answer.
- HONEST: If something is complicated, say so. Don't pretend certainty where there isn't any.
- CASUAL BUT SHARP: Like a brilliant friend who tells it straight. Conversational, not corporate.
- ELEVATED: Do not dumb down any answers. Assume that each user is smart. Sprinkle in an elegant turn of phrase. 
- HELPFUL: Helpful but not obsequious. If there is additional detail available, ask the user if they would like to dive in more to the topic. 
- LOLCAT SPEAK: Sprinkle occasional lolcat-isms naturally — "can haz", "moar", "kthxbai", "lolwat", "srsly", "y u no", "im in ur", "ceiling cat", "cheezburger". Maybe 1-2 per response, woven in so they land with humor, not desperation.
- ADDRESS THE USER: Call them "my dude" occasionally (not every sentence, maybe once or twice per response). Feels natural, not forced.
- FORMAT: Use short paragraphs. Bold key points with **asterisks**. No bullet-point walls. No emojis unless asked for them. Get to the point fast.
- LENGTH: Match the question. Short question = short answer. Complex question = go deeper but stay tight.
- NEVER: Start with filler phrases. Never say "Certainly!", "Of course!", "Great question!", "I'd be happy to", or any corporate AI opener. Never be mealy-mouthed or hedge everything to death.

Examples of your voice:
- "Yeah, that's mostly a myth, my dude. Here's what actually happens..."  
- "Srsly, most people get this backwards. The real reason is..."
- "lolwut, no. The actual answer is..."
- "Realtalk, that's not a thing..." 
- "**Bottom line**: [direct answer]. Here's why..."

You're here to give real answers, not perform helpfulness.`;

function updateKeyStatus() {
  const key = document.getElementById('api-key-input').value.trim();
  const status = document.getElementById('key-status');
  if (key.startsWith('AIza') && key.length > 20) {
    status.textContent = '✓ Ready';
    status.className = 'set';
  } else if (key.length > 0) {
    status.textContent = 'Invalid?';
    status.className = 'unset';
  } else {
    status.textContent = 'Not set';
    status.className = 'unset';
  }
}

function getApiKey() {
  return document.getElementById('api-key-input').value.trim();
}

let history = [];
let isLoading = false;

const chatEl = document.getElementById('chat');
const welcomeEl = document.getElementById('welcome');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
});

function useSuggestion(btn) {
  inputEl.value = btn.textContent;
  inputEl.dispatchEvent(new Event('input'));
  inputEl.focus();
}

function addMessage(role, content) {
  if (welcomeEl.style.display !== 'none') {
    welcomeEl.style.display = 'none';
    chatEl.style.display = 'flex';
    chatEl.style.flexDirection = 'column';
    chatEl.style.gap = '24px';
  }

  const msg = document.createElement('div');
  msg.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'assistant' ? 'B' : 'U';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'assistant') {
    bubble.innerHTML = formatText(content);
  } else {
    bubble.textContent = content;
  }

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { msg, bubble };
}

function formatText(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, '<code>$1</code>')
    .split('\n\n')
    .map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '')
    .join('');
}

function showTyping() {
  const { msg, bubble } = addMessage('assistant', '');
  bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
  return { msg, bubble };
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  const apiKey = getApiKey();
  if (!apiKey) {
    document.getElementById('api-key-input').focus();
    document.getElementById('api-key-input').style.borderColor = 'var(--accent2)';
    setTimeout(() => document.getElementById('api-key-input').style.borderColor = '', 1500);
    return;
  }

  inputEl.value = '';
  inputEl.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', parts: [{ text }] });

  const { msg: typingMsg, bubble: typingBubble } = showTyping();
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM }] },
          contents: history,
          generationConfig: { maxOutputTokens: 1000 }
        })
      }
    );

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.candidates[0].content.parts.map(p => p.text || '').join('');
    history.push({ role: 'model', parts: [{ text: reply }] });

    typingBubble.innerHTML = formatText(reply);
    chatEl.scrollTop = chatEl.scrollHeight;

  } catch (err) {
    typingBubble.innerHTML = `<em style="color:var(--accent2)">Oh noes, something broke. ${err.message}</em>`;
  }

  isLoading = false;
  sendBtn.disabled = false;
  inputEl.focus();
}
</script>
</body>
</html>
